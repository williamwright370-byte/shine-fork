plugins { 
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' 
    id 'maven-publish' 
} 
version = '1.0.0' 
group = 'net.shine.fork' 
repositories { 
    maven { url = "https://fabricmc.net" } 
} 
dependencies { 
    minecraft "com.mojang:minecraft:26.2" 
    modImplementation "net.fabricmc:fabric-loader:0.19.3" 
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.105.0+26.2" 
} 
tasks.withType(JavaCompile).configureEach { 
    options.release = 21 
}
